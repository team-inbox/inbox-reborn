name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier (formatting)
        run: npm run format:check
      - name: ESLint (JavaScript)
        run: npm run lint:js
      - name: stylelint (CSS)
        run: npm run lint:css
      - name: Versions match (manifests, package.json, package-lock.json)
        run: npm run check:versions
      - name: Referenced images exist
        run: npm run check:assets

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test

  build:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Chrome zip
        run: BUILD_OUTPUT_DIR=dist node build.js chrome zip
      - name: Build Firefox zip
        run: BUILD_OUTPUT_DIR=dist node build.js firefox zip
      - name: Validate Firefox package (addons-linter)
        run: npm run lint:firefox
      - name: Upload extension zips
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error
